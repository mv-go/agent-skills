name: Release skills
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-skills-main
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test skills and release policy
        run: |
          python3 -m unittest discover -s tests -v
          npm run test:release
      - name: Publish SemVer release and skill artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run release
      - name: Preserve release files for connected GitHub clients
        if: success() && hashFiles('dist/release/release.json') != ''
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: skill-release-${{ github.sha }}
          path: dist/release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
